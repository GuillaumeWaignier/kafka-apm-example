receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  kafka:
    brokers:
      - kafka-1:9092
    auth:
      sasl:
        username: admin
        password: admin-secret
        mechanism: SCRAM-SHA-512
    traces:
      topic: oltp_spans
    producer:
      compression: zstd
      compression_params:
        level: 3
      required_acks: -1

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: promexample

processors:
  batch:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [kafka]
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheus ]
 
